# Construit le site JupyterLite de la plateforme d'apprentissage et le publie sur GitHub Pages
name: Plateforme (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "plateforme/**"
      - "comparateur.py"
      - ".github/workflows/plateforme-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer JupyterLite
        run: pip install -r plateforme/requirements-site.txt

      - name: Construire le site
        run: python plateforme/construire_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: plateforme/_site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
